[build-system]
requires      = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name            = "logicNN-core"
version         = "0.1.0"
description     = "Dataset-independent logic-gate neural-network building blocks"
readme          = "README.md"
requires-python = ">=3.10"
license         = "MIT"
license-files   = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
dependencies    = ["torch", "numpy"]

[tool.setuptools]
package-dir          = {"" = "src"}
include-package-data = false

[tool.setuptools.packages.find]
where      = ["src"]
include    = ["logicnn_core", "logicnn_core.*"]
namespaces = false

[tool.ruff]
line-length    = 160
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
